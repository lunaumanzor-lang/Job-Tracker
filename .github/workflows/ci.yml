name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Verificar que no haya archivos sensibles en el repo
        run: |
          if git ls-files | grep -E '(^|/)(\.env|secrets\.toml|job_tracker\.db)$'; then
            echo "Hay archivos sensibles rastreados por git"
            exit 1
          fi

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Librerías del sistema para generar PDF
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr las pruebas
        run: python -m pytest tests/ -q